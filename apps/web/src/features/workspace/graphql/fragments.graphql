fragment WorkspaceBase on WorkspaceModel {
    id
    slug
    name
    logo {
        url
        originalName
    }
}

fragment WorkspaceMemberBase on WorkspaceMemberModel {
    id
    role
    joinedAt
    user {
        id
        fullName
        username
        avatarUrl
        email
    }
}

fragment WorkspaceDetails on WorkspaceModel {
    ...WorkspaceBase
    size
    createdAt
}
