apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: velo
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # NEXT_PUBLIC_* vars are baked into this image at build time.
          # Rebuild the image when API_URL or APP_URL changes.
          # Build command:
          #   docker build -f apps/web/Dockerfile.prod \
          #     --build-arg NEXT_PUBLIC_API_URL=https://your-domain.com \
          #     --build-arg NEXT_PUBLIC_APP_URL=https://your-domain.com \
          #     -t velo-web:latest .
          image: velo-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: velo-config
                  key: API_URL
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
