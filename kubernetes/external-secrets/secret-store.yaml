# The "aws-credentials" K8s secret is never stored in a file.
# Create it by running: make k8s:credentials
# (reads AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from your shell)
#
# On EKS: delete the auth block entirely and use IRSA instead.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: velo
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            key: secret-access-key
