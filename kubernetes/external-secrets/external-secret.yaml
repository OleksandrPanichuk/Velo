# ESO reads from AWS Secrets Manager and creates a native K8s Secret named "velo-secret".
# The deployments reference "velo-secret" via envFrom — no changes needed there.
#
# Store your secrets in AWS Secrets Manager as a single JSON secret named "velo/production":
#   {
#     "DB_USERNAME": "postgres",
#     "DB_PASSWORD": "...",
#     "AWS_S3_ACCESS_KEY": "...",
#     "AWS_S3_SECRET_ACCESS_KEY": "...",
#     "SMTP_USER": "...",
#     "SMTP_PASS": "...",
#     "JWT_ACCESS_SECRET": "...",
#     "JWT_REFRESH_SECRET": "...",
#     "GOOGLE_CLIENT_ID": "...",
#     "GOOGLE_CLIENT_SECRET": "...",
#     "GITHUB_CLIENT_ID": "...",
#     "GITHUB_CLIENT_SECRET": "..."
#   }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velo-secret
  namespace: velo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: velo-secret        # name of the K8s Secret ESO will create/maintain
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: velo/production  # the secret name in AWS Secrets Manager
