# Enable nginx ingress on minikube first:
#   minikube addons enable ingress
#
# For local testing, add this to /etc/hosts:
#   $(minikube ip)  velo.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velo
  namespace: velo
  annotations:
    # Required for long-lived WebSocket connections (/graphql-ws)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
spec:
  ingressClassName: nginx
  rules:
    - host: velo.local
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /graphql-ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
