apiVersion: v1
kind: ConfigMap
metadata:
  name: velo-config
  namespace: velo
data:
  NODE_ENV: "production"
  PORT: "8080"

  # Database (RDS endpoint)
  DB_HOST: "your-rds-endpoint.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "velo"

  # Redis (ElastiCache endpoint — use non-cluster mode replication group)
  REDIS_HOST: "your-elasticache-endpoint.cache.amazonaws.com"
  REDIS_PORT: "6379"

  # Cache
  CACHE_KEY_PREFIX: "velo_cache"

  # S3 (real AWS S3 — no endpoint override needed)
  AWS_S3_REGION: "us-east-1"
  AWS_S3_BUCKET_NAME: "velo"
  AWS_S3_FORCE_PATH_STYLE: "false"

  # SMTP
  SMTP_HOST: "smtp.your-provider.com"
  SMTP_PORT: "587"
  SMTP_FROM: '"Velo" <no-reply@velo.app>'
  SMTP_SECURE: "false"

  # App URLs (used for email links and OAuth redirects)
  WEB_URL: "https://your-domain.com"
  BASE_URL: "https://your-domain.com"
  CLIENT_EMAIL_VERIFICATION_URL: "https://your-domain.com/auth/verify-email"
  CLIENT_RESET_PASSWORD_URL: "https://your-domain.com/auth/reset-password"

  # OAuth callbacks
  GOOGLE_CALLBACK_URL: "https://your-domain.com/api/auth/google/callback"
  GITHUB_CALLBACK_URL: "https://your-domain.com/api/auth/github/callback"
  OAUTH_SUCCESS_REDIRECT: "https://your-domain.com/dashboard"
  OAUTH_FAILURE_REDIRECT: "https://your-domain.com/auth/login"

  # Web app (server-side — runtime configurable)
  API_URL: "http://api:8080"
